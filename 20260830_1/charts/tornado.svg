<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558">
<style>
  .bg{fill:#ffffff}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif}
  .ttl{font-size:17px;font-weight:700;fill:#1f2328}
  .sub{font-size:12px;fill:#6b7280}
  .ax{font-size:11px;fill:#6b7280}
  .lab{font-size:12px;fill:#1f2328}
  .note{font-size:11px;fill:#6b7280}
  .grid{stroke:#d1d5db;stroke-width:1}
  .axis{stroke:#9ca3af;stroke-width:1.2}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .ttl{fill:#e6edf3} .lab{fill:#e6edf3}
    .sub,.ax,.note{fill:#9ca3af}
    .grid{stroke:#30363d} .axis{stroke:#6b7280}
  }
</style>
<rect class="bg" width="900" height="558"/><text class="ttl" x="24" y="30">感度分析 — 群ごとの前提の振れ幅</text><text class="sub" x="24" y="50">群ごとに較正基準が違うので、群をまたいだ長さの比較は無意味。群Cは結合制約を外れた一次元摂動であり、答えの不確実性ではない。答えの不確実性は群A（S*制約下の同時スキャン、−23.1%〜−8.4%、14.7pt）</text><line class="grid" x1="290.3" y1="76" x2="290.3" y2="494"/><text class="ax" x="290.3" y="70" text-anchor="middle">-25%</text><line class="grid" x1="378.3" y1="76" x2="378.3" y2="494"/><text class="ax" x="378.3" y="70" text-anchor="middle">-20%</text><line class="grid" x1="466.2" y1="76" x2="466.2" y2="494"/><text class="ax" x="466.2" y="70" text-anchor="middle">-15%</text><line class="grid" x1="554.2" y1="76" x2="554.2" y2="494"/><text class="ax" x="554.2" y="70" text-anchor="middle">-10%</text><line class="grid" x1="642.1" y1="76" x2="642.1" y2="494"/><text class="ax" x="642.1" y="70" text-anchor="middle">-5%</text><line class="grid" x1="730.1" y1="76" x2="730.1" y2="494"/><text class="ax" x="730.1" y="70" text-anchor="middle">+0%</text><line x1="573.6" y1="76" x2="573.6" y2="494" stroke="#1f2328" stroke-width="1.6"/><text class="note" x="573.6" y="512" text-anchor="middle">基準 -8.9%</text><line class="grid" x1="10" y1="88" x2="840" y2="88"/><text class="note" x="10" y="84">群B 測定・規約由来（両側）</text><rect x="521.5" y="96" width="101.1" height="18" rx="3" fill="#1d4ed8" opacity="0.8"/><text class="lab" x="238" y="110" text-anchor="end">足切り段差の丸め（切捨・加法制約・正確な総数）</text><text class="note" x="630.7" y="110">5.7pt</text><rect x="573.6" y="130" width="37.0" height="18" rx="3" fill="#1d4ed8" opacity="0.8"/><text class="lab" x="238" y="144" text-anchor="end">周期平均の規約</text><text class="note" x="618.6" y="144">2.1pt</text><line class="grid" x1="10" y1="156" x2="840" y2="156"/><text class="note" x="10" y="152">群C 周辺レンジの一次元摂動（分散分解ではない）</text><rect x="323.8" y="164" width="481.1" height="18" rx="3" fill="#c2410c" opacity="0.32" stroke-dasharray="4 3" stroke="#c2410c" stroke-width="1"/><text class="lab" x="238" y="178" text-anchor="end">I_base（流入）</text><text class="note" x="812.8" y="178">27.3pt</text><rect x="285.2" y="198" width="318.6" height="18" rx="3" fill="#c2410c" opacity="0.32" stroke-dasharray="4 3" stroke="#c2410c" stroke-width="1"/><text class="lab" x="238" y="212" text-anchor="end">ρ（再捕捉率）</text><text class="note" x="611.7" y="212">18.1pt</text><rect x="448.8" y="232" width="124.8" height="18" rx="3" fill="#c2410c" opacity="0.32" stroke-dasharray="4 3" stroke="#c2410c" stroke-width="1"/><text class="lab" x="238" y="246" text-anchor="end">I_base（2026-07-20 の扱い）</text><text class="note" x="581.6" y="246">7.1pt</text><line class="grid" x1="10" y1="258" x2="840" y2="258"/><text class="note" x="10" y="254">群D 設計選択（アドホック）</text><rect x="496.9" y="266" width="168.7" height="18" rx="3" fill="#6b7280" opacity="0.8"/><text class="lab" x="238" y="280" text-anchor="end">8.0 後の I 倍率</text><text class="note" x="673.6" y="280">9.6pt</text><rect x="574.7" y="300" width="113.9" height="18" rx="3" fill="#6b7280" opacity="0.8"/><text class="lab" x="238" y="314" text-anchor="end">ローンチ挙動（アドホック幅）</text><text class="note" x="696.6" y="314">6.5pt</text><rect x="497.3" y="334" width="76.3" height="18" rx="3" fill="#6b7280" opacity="0.8"/><text class="lab" x="238" y="348" text-anchor="end">バックキャストのバイアス補正</text><text class="note" x="581.6" y="348">4.3pt</text><rect x="573.6" y="368" width="62.0" height="18" rx="3" fill="#6b7280" opacity="0.8"/><text class="lab" x="238" y="382" text-anchor="end">Bear の 6.x/7.x 比</text><text class="note" x="643.6" y="382">3.5pt</text><rect x="583.8" y="402" width="42.8" height="18" rx="3" fill="#6b7280" opacity="0.8"/><text class="lab" x="238" y="416" text-anchor="end">ローンチ倍率の規約</text><text class="note" x="634.6" y="416">2.4pt</text><rect x="572.8" y="436" width="16.8" height="18" rx="3" fill="#6b7280" opacity="0.8"/><text class="lab" x="238" y="450" text-anchor="end">ρ–I 結合</text><text class="note" x="597.6" y="450">1.0pt</text><rect x="564.3" y="470" width="14.7" height="18" rx="3" fill="#6b7280" opacity="0.8"/><text class="lab" x="238" y="484" text-anchor="end">8.0 の発売日</text><text class="note" x="587.0" y="484">0.8pt</text></svg>