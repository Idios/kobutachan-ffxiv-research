<text x="62.0" y="24.0" class="ink ttl" text-anchor="start" >活動キャラクター数の推移（64日換算・レベル下限を統一）</text>
<text x="62.0" y="40.0" class="sub sc" text-anchor="start" >有志の国勢調査を、調査の間隔と集計対象のレベル下限で揃え直したもの</text>
