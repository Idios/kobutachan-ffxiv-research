<svg width="0" height="0" style="position:absolute" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="gd-body" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#5a6372"/><stop offset=".55" stop-color="#262b33"/><stop offset="1" stop-color="#0f1115"/></radialGradient>
