  <path d="M32 14 L43 33 L40 57 L24 57 L21 33 Z" fill="url(#gd-ice)" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M32 14 L33.5 33 L32 57" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.2" fill="none"/>
</symbol>

