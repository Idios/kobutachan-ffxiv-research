  <ellipse cx="32" cy="59" rx="15" ry="4" fill="none" stroke="#ff9f43" stroke-width="2.6"/>
</symbol>

<!-- 邀撃システム（黒い柱に緑の輪） -->
<symbol id="i-system" viewBox="0 0 64 64">
  <path d="M10 56 L32 50 L54 56 L32 62 Z" fill="#2b6cb0" opacity=".35"/>
  <rect x="21" y="5" width="22" height="52" rx="7" fill="url(#gd-pillar)" stroke="#6b7482" stroke-width="2"/>
  <rect x="25" y="9" width="14" height="5" rx="2.5" fill="#6b7482"/>
  <rect x="16" y="27" width="32" height="10" rx="5" fill="url(#gd-glow-green)" stroke="#a7f3c4" stroke-width="1.5"/>
  <rect x="27" y="42" width="10" height="3" rx="1.5" fill="#6b7482"/>
</symbol>

<!-- アイスドトームリス：大（氷の結晶の大きな塊） -->
<symbol id="i-ice-large" viewBox="0 0 64 64">
