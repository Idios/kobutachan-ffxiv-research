</defs>

<!-- 等級アイコン（公式は無印） -->
<symbol id="g-ext" viewBox="0 0 16 16"><rect x="1.5" y="3.5" width="11" height="11" rx="2" fill="none" stroke="#c3c2b7" stroke-width="1.5"/><path d="M8 8 L14 2 M10 2 H14 V6" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="round"/></symbol>
<symbol id="g-obs" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#0ca30c"/><path d="M4.5 8.2 L7 10.6 L11.5 5.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="g-calc" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" stroke="#898781" stroke-width="1.5"/><path d="M5 6.5 H11 M5 9.5 H11" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/></symbol>
<symbol id="g-unk" viewBox="0 0 16 16"><path d="M8 1.5 L15 14.5 H1 Z" fill="#fab219"/><text x="8" y="13" font-size="9" font-weight="700" text-anchor="middle" fill="#0b0b0b" font-family="sans-serif">?</text></symbol>

<!-- ランクの図形（B 青の三角形／A 赤のひし形／S 黄の五角形）。色だけに頼らないよう文字も入れる -->
<symbol id="r-B" viewBox="0 0 48 48"><path d="M24 4 L45 41 H3 Z" fill="#3987e5" stroke="#cde2fb" stroke-width="2" stroke-linejoin="round"/><text x="24" y="35" font-size="17" font-weight="800" text-anchor="middle" fill="#fff" font-family="sans-serif">B</text></symbol>
<symbol id="r-A" viewBox="0 0 48 48"><path d="M24 2.5 L45.5 24 L24 45.5 L2.5 24 Z" fill="#e34948" stroke="#ffd2d2" stroke-width="2" stroke-linejoin="round"/><text x="24" y="30" font-size="17" font-weight="800" text-anchor="middle" fill="#fff" font-family="sans-serif">A</text></symbol>
<symbol id="r-S" viewBox="0 0 48 48"><path d="M24 3 L45 18.5 L37 44 H11 L3 18.5 Z" fill="#f2c230" stroke="#fff3c4" stroke-width="2" stroke-linejoin="round"/><text x="24" y="33" font-size="17" font-weight="800" text-anchor="middle" fill="#0b0b0b" font-family="sans-serif">S</text></symbol>

<!-- 邀撃ドローン（黒い球体に緑に光る枝角） -->
<symbol id="i-drone" viewBox="0 0 64 64">
  <ellipse cx="32" cy="58" rx="17" ry="3.5" fill="#3ddc84" opacity=".22"/>
  <g stroke="#3ddc84" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M23 24 L16 12 L9 10 M16 12 L15 4"/>
    <path d="M41 24 L48 12 L55 10 M48 12 L49 4"/>
    <path d="M32 19 L32 6"/>
  </g>
  <circle cx="32" cy="37" r="17" fill="url(#gd-body)" stroke="#3ddc84" stroke-width="2"/>
  <circle cx="32" cy="37" r="9.5" fill="none" stroke="#3ddc84" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="32" cy="37" r="5.5" fill="url(#gd-glow-green)"/>
  <circle cx="25" cy="30" r="3" fill="#fff" opacity=".18"/>
</symbol>

<!-- 邀撃ドローンα（金色） -->
<symbol id="i-drone-alpha" viewBox="0 0 64 64">
  <ellipse cx="32" cy="58" rx="17" ry="3.5" fill="#f5c242" opacity=".28"/>
  <g stroke="#ffd34d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M23 24 L16 12 L9 10 M16 12 L15 4"/>
    <path d="M41 24 L48 12 L55 10 M48 12 L49 4"/>
    <path d="M32 19 L32 6"/>
  </g>
  <circle cx="32" cy="37" r="17" fill="url(#gd-body-gold)" stroke="#fff1b8" stroke-width="2"/>
  <circle cx="32" cy="37" r="5.5" fill="#fffbe6"/>
  <path d="M52 30 L54 34 L58 36 L54 38 L52 42 L50 38 L46 36 L50 34 Z" fill="#fff4c2"/>
</symbol>

<!-- 邀撃コマンダー（六角形の障壁の中の大きな球体。下に受け止める着弾点） -->
<symbol id="i-commander" viewBox="0 0 64 64">
  <path d="M32 2 L53 14 L53 38 L32 50 L11 38 L11 14 Z" fill="#8b7cf6" fill-opacity=".14" stroke="#a99cff" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="32" cy="26" r="12.5" fill="url(#gd-body)" stroke="#c9c2ff" stroke-width="2"/>
